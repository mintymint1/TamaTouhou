; TamaTouhou firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75 (16 MB flash, 8 MB OPI PSRAM).
;   pio run -e amoled175                 build
;   pio run -e amoled175 -t upload       flash
;   pio run -e amoled175 -t uploadfs     flash the theme assets in data/ (LittleFS)
;   pio device monitor                   serial console (115200)
; Usually run from the repo root: make board / make flash / make release.
; Host tests for the engine don't need PlatformIO: see test/host/Makefile.

[env:amoled175]
; Arduino-ESP32 core 3.x via the pioarduino platform (the stock espressif32 platform ships
; core 2.x). TamaPoke is verified on core 3.3.x; keep this pinned and bump it on purpose.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip   ; Arduino core 3.3.11 (TamaPoke: 3.3.10)
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_upload.arduino.boot_app0 = 0xFEE000     ; its own otadata slot, not inside NVS (see the .csv)
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi      ; OPI PSRAM: the 466x466 framebuffer lives there
board_build.f_cpu = 240000000L

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1          ; serial console over the USB-C port
  -std=gnu++17
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Wno-unused-parameter

; Pinned so every build (yours, CI, the web flasher's) uses the same drivers. Bump on purpose.
lib_deps =
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.5.0
  lewisxhe/XPowersLib@0.3.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
