# Touhou roster: 48 species (format: docs/themes.md)
# Tiers: common (animal/object/fairy -> youkai lines), rare, legendary, mythic (Reimu, Marisa).
# Evolution = "long-lived animals and abandoned objects become youkai".
# ids must match sprite folders: sprites/<id>/. Variants = ALT COLOR palette swaps (tools/variants.py).

