# ===================================================================== mythic: the protagonists
# Shinies: hand-picked PC-98 palette_maps (colours from `tools/variants.py touhou --palette <id>`).
- id: reimu
  name: "REIMU"
  rarity: mythic
  habitat: hakurei_shrine
  accent: "#d8283a"
  variant:          # PC-98 Reimu: purple hair, outfit unchanged
    palette_map: { "#6f4a49": "#7a4a9a", "#512c2f": "#55306e", "#221918": "#2a1a3a" }
    tolerance: 28
- id: marisa
  name: "MARISA"
  rarity: mythic
  habitat: forest_of_magic
  accent: "#e0b030"
  variant:          # PC-98 Marisa: purple hat and dress, blonde hair and white apron unchanged
    palette_map: { "#2c2933": "#5b2d8c", "#27252f": "#4e2679", "#35313b": "#6b3aa0", "#0a0820": "#2a0d45" }
    tolerance: 24
